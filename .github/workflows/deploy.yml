# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy.yml
# GitHub Actions CI/CD 파이프라인 - AWS EC2 자동 배포
#
# 트리거: inseon 브랜치에 push 될 때 (PR merge 포함)
#
# 흐름:
#   1. 코드 체크아웃
#   2. Python 코드 린트 (ruff) & 테스트 (pytest)
#   3. Docker 이미지 빌드 → ECR 푸시
#   4. EC2 SSH 접속 → 최신 이미지 pull → 재배포
#
# GitHub Secrets 설정 필요:
#   AWS_ACCESS_KEY_ID       - IAM 사용자 Access Key
#   AWS_SECRET_ACCESS_KEY   - IAM 사용자 Secret Key
#   AWS_REGION              - 예: ap-northeast-2 (서울)
#   ECR_REPOSITORY          - ECR 레포지토리 이름 (예: kids-chatbot-api)
#   EC2_HOST                - EC2 퍼블릭 IP 또는 도메인
#   EC2_USERNAME            - EC2 SSH 사용자명 (예: ubuntu, ec2-user)
#   EC2_SSH_KEY             - EC2 접속용 PEM 키 (개행 포함 전체 내용)
#   ENV_PROD_FILE           - .env.prod 파일 내용 전체 (민감 정보 포함)
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to AWS EC2

on:
  push:
    branches:
      - inseon          # inseon 브랜치 push 시 자동 배포
  workflow_dispatch:    # 수동 실행 버튼 (GitHub UI에서 직접 실행 가능)

jobs:
  # ─────────────────────────────────────────────────────────
  # 1단계: 테스트 & 린트
  # ─────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: |
          ruff check . --select E,W,F --ignore E501
        continue-on-error: true   # 린트 실패해도 배포 차단하지 않음 (경고만)

      - name: Run tests
        env:
          MY_APP_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          JWT_SECRET_KEY: test-secret-key-for-ci
          AI_PROVIDER: mock        # CI에서는 실제 AI API 호출 방지
        run: |
          # tests/ 디렉토리가 있으면 실행, 없으면 스킵
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found, skipping..."
          fi


  # ─────────────────────────────────────────────────────────
  # 2단계: Docker 빌드 → ECR 푸시 → EC2 배포
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test           # test 잡 성공 후에만 실행
    # AWS 배포 준비 완료 시에만 실행
    # 활성화 방법: GitHub repo → Settings → Variables → Actions → AWS_CONFIGURED = true 추가
    if: ${{ github.ref == 'refs/heads/inseon' && vars.AWS_CONFIGURED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS 자격증명 설정 ──────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── ECR 로그인 ─────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Docker 이미지 빌드 & ECR 푸시 ─────────────────────────────────────
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── EC2 SSH 접속 → 배포 ────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ENV_PROD_FILE: ${{ secrets.ENV_PROD_FILE }}
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USERNAME }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          envs:        ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,ENV_PROD_FILE
          script: |
            # AWS CLI ECR 로그인 (EC2 IAM Role 또는 자격증명 필요)
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # 최신 이미지 pull
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # .env.prod 갱신 (Secrets 에서 최신 값 반영)
            echo "$ENV_PROD_FILE" > /home/$USER/app/.env.prod

            # 기존 컨테이너 중지 & 새 이미지로 재시작
            cd /home/$USER/app
            docker-compose -f docker-compose.prod.yml down --remove-orphans
            docker-compose -f docker-compose.prod.yml up -d --build

            # 30초 후 헬스체크
            sleep 30
            curl -f http://localhost/  && echo "배포 성공" || echo "헬스체크 실패"

            # 오래된 이미지 정리
            docker image prune -f

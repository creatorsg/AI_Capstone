# alembic.ini - Alembic 설정 파일
# 사용법:
#   alembic revision --autogenerate -m "설명"   ← 변경사항 감지해 마이그레이션 생성
#   alembic upgrade head                         ← 최신 버전으로 DB 업그레이드
#   alembic downgrade -1                         ← 이전 버전으로 롤백
#   alembic history                              ← 마이그레이션 이력 확인
#   alembic current                              ← 현재 DB 버전 확인

[alembic]
# 마이그레이션 스크립트 위치
script_location = alembic

# DB URL은 env.py에서 환경변수로 읽음 (여기서는 사용 안 함)
# sqlalchemy.url = 직접 쓰지 말 것 → .env 파일의 MY_APP_DATABASE_URL 사용

# 마이그레이션 파일 이름 형식: 타임스탬프_설명.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 타임존
timezone = Asia/Seoul

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

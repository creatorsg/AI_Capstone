# alembic.ini - Alembic configuration
# Usage:
#   alembic revision --autogenerate -m "description"  <- auto-detect changes
#   alembic upgrade head                               <- upgrade DB to latest
#   alembic downgrade -1                               <- rollback one version
#   alembic history                                    <- show migration history
#   alembic current                                    <- show current DB version

[alembic]
script_location = alembic

# DB URL is loaded from env.py via MY_APP_DATABASE_URL environment variable
# sqlalchemy.url = do not set here

# Migration filename format: timestamp_description.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = Asia/Seoul

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

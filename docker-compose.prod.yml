# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml
# AWS EC2 프로덕션 배포용 Compose 파일
#
# 개발용(docker-compose.yml)과의 차이점:
#   1. DB: AWS RDS 사용 → db 서비스 없음, MY_APP_DATABASE_URL 만 설정
#   2. API: Dockerfile.prod 빌드, --reload 없음, gunicorn 멀티프로세스
#   3. Nginx: 리버스 프록시 + SSL 종료 (Certbot 연동)
#   4. 볼륨: 코드 마운트 없음 (이미지 내 포함), postgres_data 볼륨 없음
#   5. 환경변수: .env.prod 파일 참조
#
# 실행:
#   docker-compose -f docker-compose.prod.yml up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ─── FastAPI 백엔드 ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fastapi_prod
    restart: always
    expose:
      - "8000"          # nginx 를 통해서만 외부 노출 (직접 포트 바인딩 없음)
    env_file:
      - .env.prod       # 프로덕션 환경변수 파일
    environment:
      APP_ENV: production
    networks:
      - app_network

  # ─── Nginx 리버스 프록시 + SSL ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # SSL 인증서 (Certbot 발급)
      - certbot_www:/var/www/certbot:ro         # Certbot 도메인 인증용
    depends_on:
      - api
    networks:
      - app_network

  # ─── Certbot (Let's Encrypt 자동 SSL 갱신) ──────────────────────────────────
  # 최초 인증서 발급 후 자동 갱신 (90일마다)
  # 사용법: docker-compose -f docker-compose.prod.yml run --rm certbot certonly ...
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: renew --quiet
    networks:
      - app_network


volumes:
  certbot_www:

networks:
  app_network:
    driver: bridge

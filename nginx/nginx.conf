# ──────────────────────────────────────────────────────────────────────────────
# nginx/nginx.conf
# Nginx 리버스 프록시 설정 (AWS EC2 프로덕션)
#
# 역할:
#   1. HTTP(80) → HTTPS(443) 리다이렉트
#   2. HTTPS 요청을 FastAPI 컨테이너(api:8000)로 프록시
#   3. WebSocket 지원 (추후 실시간 채팅 확장 시 필요)
#   4. 보안 헤더 설정
#   5. 정적 파일 캐싱
#
# SSL 인증서: Let's Encrypt (Certbot)
#   최초 발급: docker-compose run certbot certonly --webroot ...
#   갱신: docker-compose run certbot renew
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 로깅 ──────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── 기본 설정 ─────────────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;   # 파일 업로드 최대 크기

    # ── Gzip 압축 ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # ── HTTP → HTTPS 리다이렉트 ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;    # 모든 도메인 (실제 도메인으로 변경 권장)

        # Certbot 인증 경로 (Let's Encrypt 도메인 소유 확인)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 나머지는 HTTPS 로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 메인 서버 ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name your-domain.com;   # ← 실제 도메인으로 변경

        # ── SSL 인증서 (Certbot 발급 경로) ────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/your-domain.com/privkey.pem;

        # 권장 SSL 설정 (Mozilla SSL Config Generator 기준)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        # ── 보안 헤더 ──────────────────────────────────────────────────────────
        add_header X-Frame-Options           "DENY"          always;
        add_header X-Content-Type-Options    "nosniff"       always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── FastAPI 프록시 ─────────────────────────────────────────────────────
        location / {
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;

            # WebSocket 지원
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 실제 클라이언트 IP 전달
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # AI 응답 타임아웃 (Claude API 최대 응답 시간 고려)
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── API 문서 (개발 편의용, 운영 환경에서는 제거 권장) ──────────────────
        location /docs {
            proxy_pass http://api:8000/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://api:8000/openapi.json;
        }
    }
}
